[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
# BLE (flake8-blind-except) deliberately excluded: crawlers catch broad
# Exception per-page so one bad page doesn't kill the whole run
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.bandit]
exclude_dirs = [".venv", "node_modules", "tests"]

[tool.pyright]
include = ["scripts", "tests"]
exclude = [".venv", "node_modules"]
extraPaths = ["scripts"]
typeCheckingMode = "basic"
pythonVersion = "3.13"
