name: Dependabot auto-merge

# Enables GitHub auto-merge (squash) when Dependabot opens a PR; GitHub merges
# once the ruleset's required checks (TypeScript, Python) pass. A push to a
# Dependabot branch by anyone other than Dependabot disables auto-merge on it.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: dependabot-auto-merge-${{ github.event.pull_request.number }}
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Enable auto-merge
        if: github.event.action == 'opened' && github.actor == 'dependabot[bot]'
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Disable auto-merge after a push by someone other than Dependabot
        if: github.event.action == 'synchronize' && github.actor != 'dependabot[bot]'
        run: |
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            gh pr merge --disable-auto "$PR_URL"
          fi
