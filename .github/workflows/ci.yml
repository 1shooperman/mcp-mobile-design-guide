name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run lint
      - run: npm test

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: sudo apt-get install -y libxml2-dev libxslt-dev
      - run: pip install pytest pylint -r requirements.txt
      - run: pylint scripts/crawl_android.py scripts/crawl_apple.py
      - run: pytest
